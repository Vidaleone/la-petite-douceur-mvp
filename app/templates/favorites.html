{% extends "base.html" %}{% block title %}Favoritos{% endblock %}{% block content %}<h1>Meus favoritos</h1><div class="grid">{% for p in products %}<article class="card"><div class="emoji">{{ p.image_emoji }}</div><div class="pad"><h3>{{ p.name }}</h3><p>{{ p.description }}</p><b>R$ {{ "%.2f"|format(p.price)|replace(".",",") }}</b><form method="post" action="{{ url_for('add_cart',product_id=p.id) }}"><button class="btn small">Adicionar</button></form><form method="post" action="{{ url_for('toggle_favorite',product_id=p.id) }}"><button class="text-button">Remover dos favoritos</button></form></div></article>{% else %}<p>Nenhum favorito salvo.</p>{% endfor %}</div>{% endblock %}
