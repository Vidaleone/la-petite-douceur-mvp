{% extends "admin/base_admin.html" %}{% block title %}Editar produto{% endblock %}{% block admin_content %}<h1>Editar produto</h1><form class="form-card" method="post"><label>Nome<input name="name" value="{{ product.name }}" required></label><label>Categoria<select name="category">{% for c in ['Clássicos','Especiais','Premium','Veganos'] %}<option {{ 'selected' if product.category==c else '' }}>{{ c }}</option>{% endfor %}</select></label><label>Preço<input name="price" value="{{ product.price }}" required></label><label>Emoji<input name="emoji" value="{{ product.image_emoji }}"></label><label>Ingredientes (separados por vírgula)<input name="ingredients" value="{{ product.ingredients|from_json|join(', ') }}"></label><label>Descrição<textarea name="description">{{ product.description }}</textarea></label><label><input type="checkbox" name="active" {{ 'checked' if product.active else '' }}> Produto ativo</label><button class="btn">Salvar</button></form>{% endblock %}
