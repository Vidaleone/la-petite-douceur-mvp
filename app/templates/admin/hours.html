{% extends "admin/base_admin.html" %}{% block title %}Horários{% endblock %}{% block admin_content %}<h1>Horários de funcionamento</h1><p>Formato: HH:MM-HH:MM ou “Fechado”.</p><form class="form-card" method="post">{% for key,label in days %}<label>{{ label }}<input name="{{ key }}" value="{{ data.get(key,'Fechado') }}" placeholder="09:00-18:00 ou Fechado"></label>{% endfor %}<button class="btn">Salvar horários</button></form>{% endblock %}
