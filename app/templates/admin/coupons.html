{% extends "admin/base_admin.html" %}{% block title %}Cupons{% endblock %}{% block admin_content %}<h1>Cupons de desconto</h1><form class="inline-form" method="post"><input name="code" placeholder="Código" required><select name="kind"><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option></select><input name="value" type="number" step=".01" placeholder="Desconto" required><input name="min_total" type="number" step=".01" placeholder="Pedido mínimo"><input name="expires_at" type="date"><button class="btn small">Criar cupom</button></form>{% for c in coupons %}<div class="list-row"><span><b>{{ c.code }}</b> — {{ c.value }} {{ '%' if c.kind=='percent' else 'R$' }} · {{ 'Ativo' if c.active else 'Inativo' }}</span><form method="post" action="{{ url_for('toggle_coupon',coupon_id=c.id) }}"><button class="text-button">Ativar/desativar</button></form></div>{% endfor %}{% endblock %}
