{% extends "base.html" %}{% block title %}Finalizar pedido{% endblock %}{% block content %}<section class="form-card wide"><h1>Finalizar pedido</h1><p>Subtotal: <b>R$ {{ "%.2f"|format(subtotal)|replace(".",",") }}</b></p><form method="post">
<label>Nome para o pedido<input name="name" value="{{ current_user.name }}" required></label><label>Telefone<input name="phone" required placeholder="(00) 00000-0000"></label>
<fieldset><legend>Recebimento</legend><label><input type="radio" name="fulfillment" value="retirada" checked> Retirada no local</label><label><input type="radio" name="fulfillment" value="entrega"> Entrega</label></fieldset>
<label>Endereço (obrigatório para entrega)<input name="address"></label><fieldset><legend>Pagamento (simulação acadêmica)</legend><label><input type="radio" name="payment" value="pix" checked> Pix</label><label><input type="radio" name="payment" value="cartao"> Cartão</label></fieldset>
<label>Cupom de desconto<input name="coupon" placeholder="Ex.: BEMVINDO10"></label><label>Observações<textarea name="notes"></textarea></label><button class="btn">Enviar pedido</button></form><small>Não há integração financeira. Nenhuma cobrança real será realizada.</small></section>{% endblock %}
